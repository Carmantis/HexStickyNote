# Dependabot opens only security updates here (open-pull-requests-limit: 0
# turns the regular version updates off). The ignore rules apply to security
# updates too.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # SvelteKit 3 needs Vite 8, vite-plugin-svelte 7 and TypeScript 6: a
      # migration of its own, not a security update. The advisory that keeps
      # suggesting it (Remote Functions) is server-side; this app is static.
      - dependency-name: "@sveltejs/kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/adapter-static"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
